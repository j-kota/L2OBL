name: master_env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy=1.26.3
  - scipy=1.10.1
  - pytorch=2.1.0
  - cvxpy=1.2.0
  - matplotlib
  - ipython
  - pip
  - pip:
      - diffcp==1.0.23
      - neuromancer
      - pyswarms
      - wandb
      - mpc
      - numdifftools
      - nose
